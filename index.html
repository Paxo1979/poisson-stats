<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poisson Stats Top 5</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #121212; color: #ffffff; padding: 15px; margin: 0; }
        h1 { font-size: 20px; text-align: center; color: #00e676; }
        .card { background-color: #1e1e1e; border-radius: 10px; padding: 15px; margin-bottom: 15px; border: 1px solid #333; }
        label { display: block; margin-top: 10px; font-weight: bold; font-size: 14px; color: #bbb; }
        select { width: 100%; padding: 10px; margin-top: 5px; border-radius: 6px; background-color: #2a2a2a; color: #fff; border: 1px solid #444; font-size: 16px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .stat-box { background: #262626; padding: 10px; border-radius: 6px; text-align: center; }
        .stat-title { font-size: 12px; color: #aaa; }
        .stat-val { font-size: 18px; font-weight: bold; color: #00e676; margin-top: 4px; }
    </style>
</head>
<body>
    <h1>Poisson Stats Engine</h1>
    <div class="card">
        <label for="league">Campionato:</label>
        <select id="league">
            <option value="serie_a">Serie A</option>
            <option value="premier_league">Premier League</option>
            <option value="la_liga">La Liga</option>
            <option value="bundesliga">Bundesliga</option>
            <option value="ligue_1">Ligue 1</option>
        </select>
        <label for="homeTeam">Squadra in Casa:</label>
        <select id="homeTeam"><option>Seleziona...</option></select>
        <label for="awayTeam">Squadra in Trasferta:</label>
        <select id="awayTeam"><option>Seleziona...</option></select>
    </div>
    <div class="card">
        <h3>Analisi e Poisson</h3>
        <div class="grid">
            <div class="stat-box"><div class="stat-title">Prob. 1X2</div><div class="stat-val" id="prob1X2">-</div></div>
            <div class="stat-box"><div class="stat-title">Over 2.5</div><div class="stat-val" id="probOver">-</div></div>
            <div class="stat-box"><div class="stat-title">Gol / NoGol</div><div class="stat-val" id="probGNG">-</div></div>
            <div class="stat-box"><div class="stat-title">Clean Sheet Casa</div><div class="stat-val" id="cleanSheetHome">-</div></div>
        </div>
    </div>
</body>
</html>
